name: Release

on:
  push:
    branches: [master, chore/publish-prerelease]

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Use Node.js LTS
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/-1'

    - name: Install Dependencies
      run: npm ci

    - name: Build Source
      run: npm run build

    - name: Set Prerelease Version
      id: set-version
      run: |
        latest_tag="$(git tag --list 'v*' --sort=-version:refname |
          awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found = 1 }')"
        if [ -z "$latest_tag" ]; then
          echo "::error::No release tag matching vMAJOR.MINOR.PATCH was found."
          exit 1
        fi
        echo "version=${latest_tag#v}-next.$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

    - name: Publish to Artifactory
      uses: ./
      with:
        config-dir: .github
        new-version: ${{ steps.set-version.outputs.version }}
      env:
        NPM_TOKEN: ${{ secrets.ZOWE_ARTIFACTORY_TOKEN }}
