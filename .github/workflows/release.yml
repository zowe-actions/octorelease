name: Release

on:
  push:
    branches: [master, chore/publish-prerelease]

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Use Node.js LTS
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/-1'

    - name: Install Dependencies
      run: npm ci

    - name: Build Source
      run: npm run build

    - name: Publish to Artifactory
      uses: ./
      with:
        config-dir: .github
        dry-run: true
      env:
        NPM_TOKEN: ${{ secrets.ZOWE_ACTIONS_JFROG_TOKEN }}
